name: Vest Routines

on:
  schedule:
    - cron: '0 18 * * 0'   # Every Sunday 6pm UTC (8pm Brussels)
  workflow_dispatch:         # Manual trigger from Claude Code or GitHub UI

jobs:
  vest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run market tracker
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: cd scripts && python nse_tracker.py

      - name: Run job scanner (Surya — senior architect roles)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: cd scripts && python job_scanner.py

      - name: Run PMO scanner (Ramalakshmi — PMO & programme roles)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: cd scripts && python pmo_scanner.py

      - name: Run signal logger
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: cd scripts && python signal_logger.py

      - name: Commit output
        run: |
          git config user.name "vest-bot"
          git config user.email "vest-bot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: vest routines output $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
