name: Vest Routines

on:
  schedule:
    - cron: '0 17 * * *'   # Daily 5pm UTC — Vest Intelligence Brief (market tracker + signal log)
    - cron: '0 18 * * 0'   # Sunday 6pm UTC — Job scans (Surya + Ramalakshmi)
  workflow_dispatch:         # Manual trigger from Claude Code or GitHub UI

jobs:
  vest-brief:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 17') || startsWith(github.event.schedule, '0 18')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Vest Intelligence Brief
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: cd scripts && python nse_tracker.py
      - name: Commit output
        run: |
          git config user.name "vest-bot"
          git config user.email "vest-bot@users.noreply.github.com"
          git add output/vest-brief-*.md output/signal_log.csv
          git diff --cached --quiet || git commit -m "chore: vest brief $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push

  job-scanner:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 18')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run job scanner
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: cd scripts && python job_scanner.py
      - name: Commit output
        run: |
          git config user.name "vest-bot"
          git config user.email "vest-bot@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: job scan output $(date -u +%Y-%m-%d)"
          git pull --rebase origin main && git push
